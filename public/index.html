<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech to Text</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Speech to Text</h1>
  <p class="sub">Speak in Hindi, English or both</p>

  <div class="box">
    <div class="toolbar">
      <button id="startBtn" class="primary">Start</button>
      <button id="stopBtn" disabled>Stop</button>
      <span id="status">idle</span>
    </div>
    <textarea id="liveTxt" placeholder="Click Start and speak. You can edit the text before saving."></textarea>
    <div class="toolbar">
      <button id="saveBtn" class="primary">Save</button>
      <button id="copyBtn">Copy</button>
      <button id="clearBtn">Clear</button>
      <span id="wordCount"></span>
    </div>
  </div>

  <div class="box">
    <h2>History</h2>
    <input id="search" type="search" placeholder="Search..." aria-label="Search history">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>#</th><th>Text</th><th>Date</th><th>Actions</th></tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
